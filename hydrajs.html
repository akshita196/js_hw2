<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Akshita">
  <title>Hydra</title>
  <script src="https://unpkg.com/hydra-synth@1.3.29/dist/hydra-synth.js"></script>
</head>
<body>
  <script>
    let zoom = 1
    window.addEventListener('mousemove', (e) =>  {
      zoom = 0.5 + e.clientX / window.innerWidth * 2
    })
    function setup () {
      const canvas = document.createElement('canvas')
      canvas.width = 600
      canvas.height = 600

      const hydra = new Hydra({
        canvas,
        detectAudio: false
      })

      osc(10, 0.1, 1.2)
        .color(0.9, 0.8, 0.2)
        .kaleid(6)
        .rotate(0, 0.5)
        .modulate(noise(5), 0.3)
        .scale(() => zoom)
        .out()

      document.body.appendChild(hydra.canvas)
    }

    window.addEventListener('load', setup)
  </script>
</body>
</html>
